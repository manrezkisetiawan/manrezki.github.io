<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Web - Nama Masing-masing</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            font-family: Poppins;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        
        .profile-container {
            margin-top: 90px;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #000;
        }

        /* Identitas */
        .identity {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        /* Ikon Sosial Media */
        .social-icons {
            margin-top: 20px;
        }

        .social-icons a {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            margin: 0 8px;
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 50%;
            text-decoration: none;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .social-icons a:hover {
            background-color: #000;
            color: #fff;
        }

        /* Tabel Informasi */
        table {
            margin: 30px auto;
            border-collapse: collapse;
            width: 60%;
            max-width: 600px;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
        }

        th {
            background-color: #000;
            color: #fff;
        }

        /* Waktu */
        #datetime {
            margin-top: 30px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- Foto Profil -->
    <div class="profile-container">
        <img src="foto-profil.jpg" alt="Foto Profil" class="profile-pic">
    </div>

    <!-- Identitas -->
    <div class="identity">
         Man Rezki Setiawan /
         NIM: 102022430015 /
         Fakultas Rekayasa Industri /
         Program Studi S1 Sistem Informasi
    </div>

    <!-- Ikon Sosial Media -->
    <div class="social-icons">
        <a href="https://github.com/manrezkisetiawan" target="_blank" title="GitHub">G</a>
        <a href="https://instagram.com/manrezki___" target="_blank" title="Instagram">IG</a>
    </div>
</body>
</html>
